{% extends 'base.html' %}
{% block content %}
<h2>Borrar Sala</h2>
<p>¿Seguro que deseas borrar la <strong>Sala {{ sala.numero_sala }}</strong> de la sucursal <strong>{{ sala.sucursal.nombre_cine }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <a class="btn btn-secondary" href="{% url 'ver_sala' %}">Cancelar</a>
  <button class="btn btn-danger" type="submit">Borrar</button>
</form>
{% endblock %}
